<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Arial, Helvetica, sans-serif">
  <!-- Page -->
  <rect width="800" height="620" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="50" y="44" font-size="24" font-weight="bold" fill="#0F1A2C" letter-spacing="4">FLOOR PLAN</text>
  <text x="52" y="66" font-size="12" fill="#9A958A" letter-spacing="2">SAMPLE · 2 BEDROOM · REPLACE FROM THE CEO PANEL</text>

  <!-- North arrow -->
  <g transform="translate(740,46)">
    <circle r="20" fill="#F8F6F1" stroke="#D4A843" stroke-width="2"/>
    <path d="M0 -12 L5 6 L0 2 L-5 6 Z" fill="#0F1A2C"/>
    <text x="0" y="-24" font-size="10" font-weight="bold" fill="#0F1A2C" text-anchor="middle">N</text>
  </g>

  <!-- Slab -->
  <rect x="50" y="90" width="700" height="450" fill="#FCFBF8"/>

  <!-- Balcony (left strip, hatched feel) -->
  <rect x="50" y="440" width="330" height="100" fill="#F1EEE6"/>
  <g stroke="#D8D3C6" stroke-width="2">
    <line x1="50" y1="540" x2="150" y2="440"/>
    <line x1="110" y1="540" x2="210" y2="440"/>
    <line x1="170" y1="540" x2="270" y2="440"/>
    <line x1="230" y1="540" x2="330" y2="440"/>
    <line x1="290" y1="540" x2="380" y2="440"/>
  </g>

  <!-- Rooms fills -->
  <rect x="54" y="94" width="322" height="202" fill="#FDFCF9"/>        <!-- living -->
  <rect x="54" y="300" width="322" height="136" fill="#F7F4ED"/>       <!-- kitchen -->
  <rect x="384" y="94" width="362" height="166" fill="#FDFCF9"/>       <!-- bedroom 1 -->
  <rect x="384" y="264" width="362" height="166" fill="#FDFCF9"/>      <!-- bedroom 2 -->
  <rect x="384" y="434" width="210" height="102" fill="#EFF4F7"/>      <!-- bathroom -->
  <rect x="598" y="434" width="148" height="102" fill="#F7F4ED"/>      <!-- hall -->

  <!-- Exterior walls -->
  <rect x="50" y="90" width="700" height="450" fill="none" stroke="#0F1A2C" stroke-width="9"/>

  <!-- Interior walls -->
  <g stroke="#0F1A2C" stroke-width="5">
    <line x1="380" y1="90" x2="380" y2="540"/>
    <line x1="50" y1="300" x2="380" y2="300"/>
    <line x1="50" y1="440" x2="380" y2="440"/>
    <line x1="380" y1="264" x2="750" y2="264"/>
    <line x1="380" y1="434" x2="750" y2="434"/>
    <line x1="598" y1="434" x2="598" y2="540"/>
  </g>

  <!-- Door gaps (white) + swing arcs -->
  <g>
    <!-- entrance door (right wall of hall) -->
    <rect x="744" y="452" width="10" height="52" fill="#FFFFFF"/>
    <path d="M746 504 A52 52 0 0 0 694 452" fill="none" stroke="#B8923A" stroke-width="2" stroke-dasharray="5 4"/>
    <!-- bedroom 1 door (on central wall) -->
    <rect x="375" y="150" width="10" height="50" fill="#FFFFFF"/>
    <path d="M385 200 A50 50 0 0 1 435 150" fill="none" stroke="#B8923A" stroke-width="2" stroke-dasharray="5 4"/>
    <!-- bedroom 2 door -->
    <rect x="375" y="320" width="10" height="50" fill="#FFFFFF"/>
    <path d="M385 370 A50 50 0 0 1 435 320" fill="none" stroke="#B8923A" stroke-width="2" stroke-dasharray="5 4"/>
    <!-- bathroom door -->
    <rect x="470" y="429" width="50" height="10" fill="#FFFFFF"/>
    <path d="M520 439 A50 50 0 0 1 470 489" fill="none" stroke="#B8923A" stroke-width="2" stroke-dasharray="5 4"/>
    <!-- kitchen door -->
    <rect x="200" y="295" width="50" height="10" fill="#FFFFFF"/>
    <path d="M250 305 A50 50 0 0 1 200 355" fill="none" stroke="#B8923A" stroke-width="2" stroke-dasharray="5 4"/>
    <!-- balcony sliders -->
    <rect x="140" y="435" width="150" height="10" fill="#FFFFFF"/>
    <line x1="140" y1="440" x2="290" y2="440" stroke="#B8923A" stroke-width="2"/>
  </g>

  <!-- Furniture hints -->
  <g fill="#E7E3D9" stroke="#C9C4B5" stroke-width="2">
    <!-- sofa -->
    <rect x="80" y="120" width="150" height="46" rx="8"/>
    <rect x="80" y="166" width="34" height="70" rx="8"/>
    <!-- dining -->
    <rect x="270" y="215" width="84" height="54" rx="10"/>
    <!-- kitchen counters -->
    <rect x="60" y="310" width="300" height="30"/>
    <rect x="60" y="340" width="34" height="90"/>
    <!-- beds -->
    <rect x="420" y="112" width="96" height="130" rx="8"/>
    <rect x="430" y="112" width="76" height="26" rx="6" fill="#D8D3C6"/>
    <rect x="580" y="282" width="96" height="130" rx="8"/>
    <rect x="590" y="282" width="76" height="26" rx="6" fill="#D8D3C6"/>
    <!-- wardrobes -->
    <rect x="690" y="112" width="46" height="120"/>
    <rect x="690" y="282" width="46" height="120"/>
    <!-- bath fixtures -->
    <rect x="400" y="450" width="70" height="34" rx="8"/>
    <circle cx="540" cy="466" r="16"/>
    <rect x="400" y="500" width="46" height="26" rx="8"/>
  </g>

  <!-- Room labels -->
  <g text-anchor="middle">
    <text x="216" y="220" font-size="17" font-weight="bold" fill="#0F1A2C" letter-spacing="2">LIVING ROOM</text>
    <text x="216" y="242" font-size="12" fill="#8A8578">4.6 × 3.4 m</text>

    <text x="216" y="378" font-size="15" font-weight="bold" fill="#0F1A2C" letter-spacing="2">KITCHEN</text>
    <text x="216" y="398" font-size="12" fill="#8A8578">4.6 × 2.2 m</text>

    <text x="216" y="502" font-size="14" font-weight="bold" fill="#6B6656" letter-spacing="2">BALCONY</text>

    <text x="565" y="196" font-size="16" font-weight="bold" fill="#0F1A2C" letter-spacing="2">BEDROOM 1</text>
    <text x="565" y="217" font-size="12" fill="#8A8578">4.2 × 3.6 m</text>

    <text x="565" y="372" font-size="16" font-weight="bold" fill="#0F1A2C" letter-spacing="2">BEDROOM 2</text>
    <text x="565" y="393" font-size="12" fill="#8A8578">4.2 × 3.6 m</text>

    <text x="489" y="484" font-size="13" font-weight="bold" fill="#0F1A2C" letter-spacing="1">BATHROOM</text>

    <text x="674" y="482" font-size="12" font-weight="bold" fill="#0F1A2C" letter-spacing="1">HALL</text>
    <text x="674" y="500" font-size="11" fill="#8A8578">ENTRANCE</text>
  </g>

  <!-- Dimensions -->
  <g stroke="#B8923A" stroke-width="1.5" fill="#B8923A" font-size="12">
    <line x1="50" y1="566" x2="750" y2="566"/>
    <line x1="50" y1="560" x2="50" y2="572"/>
    <line x1="750" y1="560" x2="750" y2="572"/>
    <text x="400" y="586" text-anchor="middle" stroke="none">10.4 m</text>
    <line x1="776" y1="90" x2="776" y2="540"/>
    <line x1="770" y1="90" x2="782" y2="90"/>
    <line x1="770" y1="540" x2="782" y2="540"/>
    <text x="776" y="315" text-anchor="middle" stroke="none" transform="rotate(90 776 315)">6.6 m</text>
  </g>

  <!-- Footer -->
  <text x="50" y="608" font-size="11" fill="#A9A495">GHAYA REAL ESTATE · indicative layout · dimensions are approximate</text>
</svg>
