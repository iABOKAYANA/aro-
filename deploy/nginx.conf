# GHAYA Estate — nginx reverse proxy (Ubuntu 22.04).
# Install: cp deploy/nginx.conf /etc/nginx/sites-available/ghaya
#          ln -s /etc/nginx/sites-available/ghaya /etc/nginx/sites-enabled/ghaya
# TLS: certbot --nginx -d ghayaestate.com -d console.ghayaestate.com
#      (certbot inserts the 443 blocks + redirects below the placeholders).
#
# HEADER OWNERSHIP — do NOT add security headers here. The app sets them all
# in next.config.js `headers()` for /:path*: Strict-Transport-Security,
# X-Frame-Options SAMEORIGIN, X-Content-Type-Options, Referrer-Policy, and
# Content-Security-Policy. Duplicating them in nginx would double-send values
# (browsers concatenate duplicates → CSP violations). nginx sets ONLY proxy
# plumbing below (Host, X-Forwarded-*, X-Requested-With passthrough).
#
# UPLOAD CAP — app route caps: images 5MB (ceo/developer/whatsapp ingest),
# voice notes 10MB (src/app/api/voice-notes/route.ts). 15m gives multipart
# overhead headroom on the largest (10MB) payload; larger bodies get 413 here
# before ever hitting Node.

upstream web_public { server 127.0.0.1:3000; }
upstream web_console { server 127.0.0.1:3001; }

# ─── Public buyer site ───
server {
  listen 80;
  server_name ghayaestate.com www.ghayaestate.com;
  # certbot 443 placeholder (managed by certbot --nginx, do not hand-edit)

  client_max_body_size 15m;

  # ── AI chat SSE (POST /api/ai/chat with "stream": true) ──
  # Token gaps on CPU decode are seconds wide but the tool loop can run
  # ~4.5 min before the first token, so this route alone gets a long read
  # timeout + buffering off. The app also sends `X-Accel-Buffering: no`
  # and `: ping` heartbeats every 15s. Exact match wins over `location /`.
  location = /api/ai/chat {
    proxy_pass http://web_public;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://web_public;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_read_timeout 60s;
  }
}

# ─── Staff console ───
server {
  listen 80;
  server_name console.ghayaestate.com;
  # certbot 443 placeholder (managed by certbot --nginx, do not hand-edit)

  client_max_body_size 15m;

  location / {
    proxy_pass http://web_console;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_read_timeout 120s; # console serves CSV/media exports
  }
}
